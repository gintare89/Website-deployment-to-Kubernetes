---
- name: Control plane
  user: cloud-user
  hosts: k8s_master_control
  become: true
  vars_files:
    - vars.yaml
  tasks:
     - name: Kubernetes control panel
       ansible.builtin.command: kubeadm init --pod-network-cidr=10.244.0.0/16
       args:
         creates: /etc/kubernetes/admin.conf

     - name: Create .kube directory
       ansible.builtin.file:
         path: "{{ kube_dir_path }}"
         state: directory
         owner: cloud-user
         group: cloud-user
         mode: '0755'

     - name: Copy .kube directory
       ansible.builtin.copy:
         src: /etc/kubernetes/admin.conf
         dest: "{{ kube_dir_path }}/config"
         remote_src: true
         owner: cloud-user
         group: cloud-user
         mode: '0644'

     - name: Get Calico
       ansible.builtin.get_url:
         url: https://raw.githubusercontent.com/projectcalico/calico/v3.25.1/manifests/calico.yaml
         dest: "{{ k8_project_dir }}/calico.yaml"

     - name: Apply calico.yaml
       ansible.builtin.command: kubectl apply -f "{{ k8_project_dir }}/calico.yaml"
       environment:
         KUBECONFIG: /etc/kubernetes/admin.conf

     - name: Join worker nodes with cluster
       ansible.builtin.command: kubeadm token create --print-join-command
       register: join_command
       changed_when: false

     - name: Token
       ansible.builtin.set_fact:
         kube_join_cmd: "{{ join_command.stdout }}"
