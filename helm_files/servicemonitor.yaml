apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: laravel-metrics
  namespace: monitoring
  labels:
    release: prometheus
spec:
  selector:
    matchLabels:
      app: web-application-svc
  endpoints:
  - port: targetport
    path: /metrics
    interval: 30s
  namespaceSelector:
    matchNames:
    - ecommerce
