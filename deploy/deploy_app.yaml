---
- name: Laravel website deploy, monitoring Prometehus and grafana
  hosts: control
  vars_files:
    - vars.yaml
  tasks:
    - name: Intstall python3 
      become: true
      ansible.builtin.package:
        name: python3-pip
        state: present

    - name: Install Kubernetes python library
      become: true
      ansible.builtin.command: python3 -m pip install kubernetes

    - name: Install kubernetes.core ansible module
      ansible.builtin.command: ansible-galaxy collection install kubernetes.core

    - name: Add Bitnami Helm repo
      kubernetes.core.helm_repository:
        name: bitnami
        repo_url: https://charts.bitnami.com/bitnami

    - name: Create kubernetes ecommerce namespace 
      kubernetes.core.k8s:
        name: ecommerce
        api_version: v1
        kind: Namespace
        state: present

    - name: Install MariaDB 
      kubernetes.core.helm:
        name: mariadb
        chart_ref: bitnami/mariadb
        release_namespace: ecommerce
        set_values:
          - value: auth.rootPassword={{ mariadb_root_pass }}
            value_type: string
          - value: auth.database=ecommerce_laravel
            value_type: string
          - value: auth.username=ecommerce_admin
            value_type: string
          - value: auth.password={{ mariadb_pass }}
            value_type: string
          - value: primary.persistence.enabled=false
            value_type: raw
        wait: true

    - name: Install Redis 
      kubernetes.core.helm:
        name: redis
        chart_ref: bitnami/redis
        release_namespace: ecommerce
        set_values:
          - value: architecture=standalone
            value_type: raw
          - value: auth.enabled=true
            value_type: raw
          - value: auth.password={{ redis_pass }}
            value_type: string
          - value: master.persistence.enabled=false
            value_type: raw
        wait: true

    - name: Create monitoring namespace
      kubernetes.core.k8s:
        name: monitoring
        api_version: v1
        kind: Namespace
        state: present

    - name: Create ingress-nginx namespace 
      kubernetes.core.k8s:
        name: ingress-nginx
        api_version: v1
        kind: Namespace
        state: present


    - name: Set label for control node
      kubernetes.core.k8s:
        api_version: v1
        kind: Node
        name: control
        definition:
          metadata:
            labels:
              ingress-ready: "true"

    - name: Add ingress-nginx Helm repo
      kubernetes.core.helm_repository:
        name: ingress-nginx
        repo_url: https://kubernetes.github.io/ingress-nginx

    - name: Add prometheus-community Helm repo
      kubernetes.core.helm_repository:
        name: prometheus-community
        repo_url: https://prometheus-community.github.io/helm-charts

    - name: Update Helm
      ansible.builtin.command: helm repo update

    - name: Install ingress-nginx for grafana
      kubernetes.core.helm:
        name: ingress-nginx
        chart_ref: ingress-nginx/ingress-nginx
        release_namespace: ingress-nginx
        values_files:
          - "{{ home_dir }}/website/ingress-values.yaml"

    - name: Wait for ingress-nginx 
      ansible.builtin.command: kubectl rollout status deployment/ingress-nginx-controller -n ingress-nginx --timeout=120s

    - name: Add gzip for ingress-nginx-controller 
      ansible.builtin.command: >
        kubectl patch cm -n ingress-nginx ingress-nginx-controller
        --type merge
        -p '{"data":{"use-gzip":"true","gzip-types":"text/javascript application/javascript application/x-javascript text/css application/json text/plain","gzip-min-length":"1000","gzip-level":"5"}}'

    - name: Restart and wait for ingress-nginx-controller
      ansible.builtin.shell: |
        kubectl rollout restart deployment ingress-nginx-controller -n ingress-nginx
        kubectl rollout status deployment/ingress-nginx-controller -n ingress-nginx --timeout=120s

    - name: Install kube-prometheus-stack 
      kubernetes.core.helm:
        name: prometheus
        chart_ref: prometheus-community/kube-prometheus-stack
        release_namespace: monitoring
        values_files:
          - "{{ home_dir }}/website/grafana-ingress.yaml"
        set_values:
          - value: prometheus.prometheusSpec.enableRemoteWriteReceiver=true
            value_type: raw

    - name: Wait for garfana and prometheus
      ansible.builtin.command: kubectl rollout status deployment/prometheus-grafana -n monitoring --timeout=120s

    - name: Deploy website to kubenretes with helm
      kubernetes.core.helm:
        name: ecommerce
        chart_ref: "{{ home_dir }}/website"
        release_namespace: ecommerce
        values_files:
          - "{{ home_dir }}/values.yaml"

    - name: Wait for website
      ansible.builtin.command: kubectl rollout status deployment/web-application -n ecommerce --timeout=120s

    - name: Install metrics server
      ansible.builtin.command: kubectl apply -f https://github.com/kubernetes-sigs/metrics-server/releases/latest/download/components.yaml

    - name: Fix metrics server configuration
      ansible.builtin.command: >
        kubectl patch deployment metrics-server -n kube-system
        --type=json
        -p='[
          {"op":"add","path":"/spec/template/spec/containers/0/args/-","value":"--kubelet-insecure-tls"},
          {"op":"add","path":"/spec/template/spec/containers/0/args/-","value":"--kubelet-preferred-address-types=InternalIP,ExternalIP,Hostname"},
          {"op":"add","path":"/spec/template/spec/containers/0/args/-","value":"--kubelet-use-node-status-port"}
        ]'

    - name: Wait for metrics server 
      ansible.builtin.command: kubectl rollout status deployment/metrics-server -n kube-system --timeout=120s
